spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  jwt:
    secure-cookie: ${JWT_SECURE_COOKIE:true}
    same-site: ${JWT_COOKIE_SAME_SITE:None}
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URI}
  storage:
    local-fallback-enabled: ${LOCAL_STORAGE_FALLBACK_ENABLED:false}

logging:
  level:
    com.growtharchive: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    root: WARN
  file:
    path: ${LOG_PATH:/tmp/growth-archive/logs}
