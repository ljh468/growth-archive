spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/growth_archive}
    username: ${DATABASE_USERNAME:growth_archive}
    password: ${DATABASE_PASSWORD:growth_archive}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration,classpath:db/demo
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  jwt:
    secure-cookie: ${JWT_SECURE_COOKIE:false}
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
  storage:
    environment-prefix: ${STORAGE_ENVIRONMENT_PREFIX:local}
    local-fallback-enabled: ${LOCAL_STORAGE_FALLBACK_ENABLED:true}

logging:
  level:
    com.growtharchive: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    root: INFO
