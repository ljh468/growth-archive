spring:
  datasource:
    url: ${SUPABASE_DATABASE_URL}
    username: ${SUPABASE_DATABASE_USERNAME}
    password: ${SUPABASE_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  jwt:
    secure-cookie: ${JWT_SECURE_COOKIE:true}
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URI}
  storage:
    environment-prefix: ${STORAGE_ENVIRONMENT_PREFIX:dev}
    local-fallback-enabled: ${LOCAL_STORAGE_FALLBACK_ENABLED:false}

logging:
  level:
    com.growtharchive: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    root: INFO
  file:
    path: ${LOG_PATH:/tmp/growth-archive/logs}
