spring:
  application:
    name: growth-archive-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/growth_archive}
    username: ${DATABASE_USERNAME:growth_archive}
    password: ${DATABASE_PASSWORD:growth_archive}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-before-production}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:3600}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}
    secure-cookie: ${JWT_SECURE_COOKIE:false}
  kakao:
    client-id: ${KAKAO_REST_API_KEY:${KAKAO_CLIENT_ID:}}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
    mock-enabled: ${KAKAO_MOCK_ENABLED:true}
    initial-admin-provider-ids: ${KAKAO_INITIAL_ADMIN_PROVIDER_IDS:}
  book-search:
    kakao:
      rest-api-key: ${KAKAO_BOOK_REST_API_KEY:${KAKAO_REST_API_KEY:}}
      endpoint: ${KAKAO_BOOK_SEARCH_ENDPOINT:https://dapi.kakao.com/v3/search/book}
  invite:
    initial-code: ${INITIAL_INVITE_CODE:}
