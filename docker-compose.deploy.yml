services:
  caddy:
    image: caddy:2-alpine
    container_name: growth-archive-caddy
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST:-growth-archive.duckdns.org}
      BACKEND_HOST: ${BACKEND_HOST:-api-growth-archive.duckdns.org}
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: growth-archive-backend
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.deploy}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
    container_name: growth-archive-frontend
    environment:
      API_INTERNAL_BASE_URL: http://backend:8080/api/v1
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
